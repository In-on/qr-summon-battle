# Codemagic のビルド設定（iOS → TestFlight）
# 使い方は docs/ios-release-guide.md を見てください。
# ★ の付いた行は、必要になったら書き換えます（最初のビルドはこのままでOK）。
workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: QR        # Codemagic の Developer Portal 連携（App Store Connect API キー）の名前
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.qrsummon.battle   # Bundle ID（下の BUNDLE_ID と同じ値）
      vars:
        BUNDLE_ID: com.qrsummon.battle
        APP_VERSION: 1.0.0                               # 審査に出すバージョン
        XCODE_PROJECT: ios/QRSummon.xcodeproj
        XCODE_SCHEME: QRSummon
        # AdMob の本番ID（アプリID と リワード広告ユニットID）。
        # ADMOB_REWARDED_ID … 「スタミナ+5」用 / ADMOB_REWARDED_BOX_ID … 「携帯品BOX」用
        # テスト広告に戻すとき：2つとも ca-app-pub-3940256099942544/1712485313 にする
        ADMOB_APP_ID: ca-app-pub-1415958216072215~5391718938
        ADMOB_REWARDED_ID: ca-app-pub-1415958216072215/1997775540
        ADMOB_REWARDED_BOX_ID: ca-app-pub-1415958216072215/1694523210
      # Xcode 27（iOS 27 SDK）でビルドする（ITMS-90725 対策）。
      # 「latest」だと Codemagic の既定（26.6）になることがあるため、正式版の 27.0 を指定。
      # 27.3 は「edge」（ベータ版）なので、App Store には出せない。新しい正式版が出たら数字を上げる。
      xcode: "27.0"
    # 自動では動かさない（Web版の更新のたびにビルドされないように）。
    # Codemagic の画面で「Start new build」を押したときだけビルドします。
    scripts:
      - name: Xcode のバージョン確認（27 未満なら止める）
        script: |
          xcodebuild -version
          MAJOR=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [ "$MAJOR" -lt 27 ]; then echo "Xcode $MAJOR ではアップロードできません（27 以上が必要）"; exit 1; fi
      - name: XcodeGen を入れる
        script: brew install xcodegen
      - name: ゲームファイルのコピーと Xcode プロジェクト生成
        script: bash ios/scripts/prepare.sh
      - name: 暗号化の質問を出さない設定（ITSAppUsesNonExemptEncryption = NO）
        script: |
          PLIST=ios/QRSummon/Info.plist
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST"
      - name: 署名の設定
        script: xcode-project use-profiles
      - name: ビルド番号を上げる
        script: |
          cd ios
          # Codemagic のビルド回数（1, 2, 3…）をそのままビルド番号にする。毎回必ず大きくなる
          echo "build number: $BUILD_NUMBER"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: ipa をビルド
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
