# XcodeGen の設定ファイル（Codemagic 上で `xcodegen generate` して .xcodeproj を作ります）
# ${...} は環境変数。ios/scripts/prepare.sh が未設定のときの既定値を入れます。
name: QRSummon
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.0.0

targets:
  QRSummon:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: QRSummon
        excludes:
          - native-bridge.js
      # ページより先に実行する橋渡しスクリプト（リソースとして同梱）
      - path: QRSummon/native-bridge.js
        buildPhase: resources
      # ゲーム本体（prepare.sh がリポジトリ直下からコピー）。フォルダ構成のまま同梱する
      - path: www
        type: folder
        buildPhase: resources
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - sdk: StoreKit.framework
      - sdk: AppTrackingTransparency.framework
    info:
      path: QRSummon/Info.plist
      properties:
        CFBundleDisplayName: モンQ   # ホーム画面のアイコンの下に出る名前
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        NSCameraUsageDescription: QRコードやバーコードを読み取ってモンスターを召喚するためにカメラを使います。映像は端末の中だけで処理し、外部には送信しません。
        NSUserTrackingUsageDescription: あなたに合った広告を表示するために使用します。許可しなくてもゲームはすべて遊べます。
        GADApplicationIdentifier: ${ADMOB_APP_ID}
        QRRewardedAdUnitID: ${ADMOB_REWARDED_ID}
        QRPremiumProductID: premium30d
        # Google と提携広告ネットワークの SKAdNetwork ID（Google公式一覧・50件・2026/1/30更新版）
